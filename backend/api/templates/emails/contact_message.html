<div style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">

    <div style="padding:18px 22px;background:#111827;color:#ffffff;">
      <h2 style="margin:0;font-size:20px;line-height:1.3;">📩 New Contact Message</h2>
      <p style="margin:6px 0 0;font-size:13px;color:#d1d5db;">
        New message from your portfolio contact form
      </p>
    </div>

    <div style="padding:22px;">
      <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
        <tr>
          <td style="padding:8px 0;color:#6b7280;font-size:13px;width:90px;">ID</td>
          <td style="padding:8px 0;font-size:14px;color:#111827;"><strong>{{ id }}</strong></td>
        </tr>
        <tr>
          <td style="padding:8px 0;color:#6b7280;font-size:13px;">Date</td>
          <td style="padding:8px 0;font-size:14px;color:#111827;">{{ created_human }}</td>
        </tr>
        <tr>
          <td style="padding:8px 0;color:#6b7280;font-size:13px;">Name</td>
          <td style="padding:8px 0;font-size:14px;color:#111827;">{{ name }}</td>
        </tr>
        <tr>
          <td style="padding:8px 0;color:#6b7280;font-size:13px;">Email</td>
          <td style="padding:8px 0;font-size:14px;color:#111827;">
            <a href="mailto:{{ email }}" style="color:#2563eb;text-decoration:none;">{{ email }}</a>
          </td>
        </tr>
      </table>

      <div style="margin-bottom:22px;">
        <div style="margin-bottom:8px;font-size:13px;font-weight:bold;color:#374151;">Message</div>
        <div style="padding:14px 16px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;line-height:1.6;color:#111827;white-space:pre-wrap;">{{ message }}</div>
      </div>

      <div style="margin-top:20px;">
        <a href="{{ admin_url }}" style="display:inline-block;padding:11px 16px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:bold;">
          Open in Django Admin
        </a>
      </div>
    </div>

    <div style="padding:14px 22px;background:#f9fafb;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
      Portfolio notification · You can reply directly to this email
    </div>

  </div>
</div>
