[tool.poetry]
name = "myportfoliospa"
version = "0.1.0"
description = ""
authors = ["maxx_PC <m.petrykin@gmx.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.6"
djangorestframework = "^3.16.1"
django-cors-headers = "^4.7.0"
drf-yasg = "^1.21.10"
python-dotenv = "^1.1.1"
dj-database-url = "^3.0.1"
whitenoise = "^6.10.0"
gunicorn = "^23.0.0"
sentry-sdk = {extras = ["django"], version = "^2.39.0"}
psycopg = {version = ">=3.1,<4", extras = ["binary"]}
django-jazzmin = "^3.0.1"
requests = "^2.32.5"
django-admin-sortable2 = "^2.3"
redis = "^8.0.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portfolio_backend.test_settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
addopts = "-q --nomigrations"
