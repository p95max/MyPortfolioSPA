<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .t{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";fill:#d1d5db}
      .m{fill:#1f2937;stroke:#374151;stroke-width:2;rx:10}
      .a{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6,6;fill:none;marker-end:url(#arrow)}
      .k{fill:#0ea5e9}
      .b{fill:#10b981}
      .y{fill:#f59e0b}
      .s{fill:#d1d5db}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/>
  <text class="t" x="60" y="90" font-size="34">Amazon Publisher · API</text>
  <text class="t" x="60" y="130" font-size="18" opacity=".85">Sheets → JSON payload → validate → preview/feeds (stub)</text>

  <rect class="m" x="80" y="220" width="240" height="140"/>
  <text class="t" x="100" y="265" font-size="18">Google Sheets</text>
  <rect x="100" y="280" width="200" height="56" class="k" rx="6"/>
  <text class="t" x="120" y="316" font-size="16">rows.csv / sheets</text>

  <path class="a" d="M340 290 C400 290 440 290 500 290"/>
  <rect class="m" x="500" y="220" width="240" height="140"/>
  <text class="t" x="520" y="260" font-size="18">FastAPI</text>
  <rect x="520" y="274" width="200" height="30" class="y" rx="6"/>
  <text class="t" x="540" y="295" font-size="14">Pydantic · Schema validate</text>

  <path class="a" d="M740 290 C800 290 850 290 920 290"/>
  <rect class="m" x="920" y="220" width="240" height="140"/>
  <text class="t" x="940" y="260" font-size="18">Preview / Feeds</text>
  <rect x="940" y="274" width="200" height="30" class="b" rx="6"/>
  <text class="t" x="960" y="295" font-size="14">/preview · /feeds (stub)</text>

  <g opacity=".9">
    <rect class="m" x="80" y="420" width="1080" height="170"/>
    <text class="t" x="100" y="460" font-size="18">Example payload</text>
    <text class="s" x="100" y="490" font-size="14">{ "sku": "SKU-001", "productType": "GENERIC", "attributes": { "item_name": [{"value": "Sample"}], … } }</text>
  </g>
</svg>
