name: Apply README badges

on:
  push:
    branches:
      - agent/add-ci-checks

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-ci-checks
          fetch-depth: 0

      - name: Add workflow badges
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8-sig")
          badges = """[![CI](https://github.com/p95max/MyPortfolioSPA/actions/workflows/ci.yml/badge.svg?branch=prod)](https://github.com/p95max/MyPortfolioSPA/actions/workflows/ci.yml)
          [![CodeQL](https://github.com/p95max/MyPortfolioSPA/actions/workflows/codeql-analysis.yml/badge.svg?branch=prod)](https://github.com/p95max/MyPortfolioSPA/actions/workflows/codeql-analysis.yml)
          [![Coverage](https://codecov.io/gh/p95max/MyPortfolioSPA/branch/prod/graph/badge.svg)](https://codecov.io/gh/p95max/MyPortfolioSPA)
          """

          if "actions/workflows/ci.yml/badge.svg" not in text:
              lines = text.splitlines(keepends=True)
              insert_at = 1 if lines and lines[0].startswith("# ") else 0
              lines.insert(insert_at, "\n" + badges + "\n")
              path.write_text("".join(lines), encoding="utf-8")
          PY

          rm .github/workflows/apply-readme-badges.yml

      - name: Commit generated README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-readme-badges.yml
          git commit -m "docs: add CI status badges"
          git push origin HEAD:agent/add-ci-checks
