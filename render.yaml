databases:
  - name: portfolio-db
    databaseName: portfolio_db
    user: portfolio_user

services:
  - type: web
    name: portfolio-backend
    rootDir: backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "poetry run gunicorn config.wsgi:application -c gunicorn.conf.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ADMIN_URL
        sync: false

      - key: ALLOWED_HOST
        sync: false

      - key: EXTRA_ALLOWED_HOSTS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: TURNSTILE_SECRET
        sync: false

      - key: REDIS_URL
        sync: false

      - key: DRF_NUM_PROXIES
        value: "0"

      - key: TRUST_ANALYTICS_GEO_HEADERS
        sync: false

      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: NOTIFY_EMAILS
        sync: false

      - key: DISPLAY_TZ
        value: "Europe/Berlin"

      - key: FRONTEND_BASE_URL
        sync: false

      - key: MEMORY_LIMIT
        value: "512"

  - type: web
    name: portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://myportfoliospa.onrender.com/api/*

      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_TURNSTILE_SITEKEY
        sync: false

      - key: VITE_SNOW
        value: "auto"
