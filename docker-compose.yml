services:
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mynetwork

  db:
    image: postgres:15
    env_file:
      - ./backend/.env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    networks:
      - mynetwork

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
    networks:
      - mynetwork

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - mynetwork

  fuel_bot:
    build:
      context: ./fuel_bot
      dockerfile: Dockerfile
    env_file:
      - path: ./fuel_bot/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mynetwork

volumes:
  pgdata:
  redisdata:

networks:
  mynetwork:
