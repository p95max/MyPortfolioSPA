name: CI

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ADMIN_URL: admin/
      ALLOWED_HOST: localhost
      EXTRA_ALLOWED_HOSTS: 127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      TURNSTILE_SECRET: test-turnstile-secret
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_BASE_URL: http://testserver
      NOTIFY_EMAILS: owner@example.com
      DISPLAY_TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Validate Poetry configuration
        run: poetry check

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev
          poetry run python -m pip install pytest-cov

      - name: Run Django system checks
        run: poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run backend tests with coverage
        run: >-
          poetry run pytest
          --ds=config.test_settings
          --nomigrations
          --cov=api
          --cov=config
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
