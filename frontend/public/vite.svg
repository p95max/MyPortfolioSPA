<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#090c11"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="10.6" x2="32" y2="10.6" stroke="rgba(0,212,255,0.07)" stroke-width="0.5"/>
  <line x1="0" y1="21.3" x2="32" y2="21.3" stroke="rgba(0,212,255,0.07)" stroke-width="0.5"/>
  <line x1="10.6" y1="0" x2="10.6" y2="32" stroke="rgba(0,212,255,0.07)" stroke-width="0.5"/>
  <line x1="21.3" y1="0" x2="21.3" y2="32" stroke="rgba(0,212,255,0.07)" stroke-width="0.5"/>

  <!-- > prompt symbol -->
  <polyline points="7,11 13,16 7,21" fill="none" stroke="#00d4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- _ cursor -->
  <rect x="16" y="20" width="9" height="2" rx="1" fill="#f5a623"/>
</svg>